<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Vistorias</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%235B2A86%27/%3E%3Cpath d=%27M8 22l5-12 4 8 3-5 4 9z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{
  --roxo:#5B2A86;--roxo-esc:#3F1D63;--roxo-cl:#EFE7F7;--txt:#1F1A2B;--mut:#6B6479;--bd:#E3DEEA;--bd2:#CFC8DA;--fundo:#F4F1F8;--branco:#FFFFFF;
  --b-bd:#1E7B4B;--b-bg:rgba(30,123,75,.15);--b-fg:#14693C;
  --r-bd:#E0A100;--r-bg:rgba(224,161,0,.18);--r-fg:#7A4B00;
  --f-bd:#B3261E;--f-bg:rgba(179,38,30,.14);--f-fg:#9B1C1C;
  --n-bd:#9B94A8;--n-bg:#FFFFFF;--n-fg:#6B6479;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--txt);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font-family:inherit;font-size:inherit;color:inherit}
h1{margin:0;font-size:28px;font-weight:600;color:var(--roxo-esc)}
h2{margin:8px 0 0;font-size:18px;font-weight:600;color:var(--roxo-esc)}
h3{margin:6px 0 0;font-size:15px;font-weight:600;color:var(--roxo-esc)}
.wrap-app{max-width:1280px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.center{justify-content:center}.gap{gap:10px}
.col{display:flex;flex-direction:column;gap:4px}.col.gap{gap:8px}
.small{font-size:12px}.muted{color:var(--mut)}.b{font-weight:600}.mono{font-family:ui-monospace,Consolas,monospace}
.nr{color:var(--mut);font-style:italic}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--roxo);background:#fff;color:var(--roxo);font-weight:500;cursor:pointer}
.btn:hover{background:var(--roxo-cl)}
.btn-p{background:var(--roxo);color:#fff}.btn-p:hover{background:var(--roxo-esc)}
.btn:focus-visible,.chip:focus-visible,.pt-card:focus-visible,.no:focus-visible,.kpi-btn:focus-visible,.inp:focus-visible{outline:3px solid #9A6BC4;outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:#fff;color:#4A4458;font-weight:500;cursor:pointer}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.inp{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:#fff;min-width:240px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card.nopad{padding:0;gap:0;overflow:hidden}.pad{padding:16px}
.grid{display:grid;gap:10px;align-items:start}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-crit{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g-it{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g-pt{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-foto{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g-hist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kpi{padding:14px 16px}.kpi-v{font-size:30px;font-weight:600;line-height:1.1}.kpi-s{font-size:20px;font-weight:600;color:var(--roxo-esc)}
.kpi-btn{text-align:left;cursor:pointer;min-height:44px}.kpi-btn.on{border:2px solid var(--roxo)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.p-ok{background:#DDF3E5;color:#14693C}.p-bad{background:#FAD9D9;color:#9B1C1C}.p-gray{background:#E8E5EE;color:#4A4458}
.b-pill{border:1px solid}
.q-b{background:var(--b-bg);border-color:var(--b-bd);color:var(--b-fg)}
.q-r{background:var(--r-bg);border-color:var(--r-bd);color:var(--r-fg)}
.q-f{background:var(--f-bg);border-color:var(--f-bd);color:var(--f-fg)}
.q-n{background:var(--n-bg);border-color:var(--n-bd);color:var(--n-fg)}
.q-b-t{color:var(--b-fg);font-weight:600}.q-r-t{color:var(--r-fg);font-weight:600}.q-f-t{color:var(--f-fg);font-weight:600}.q-n-t{color:var(--n-fg)}
/* access point "Regular": cinza esverdeado, distinto do amarelo do Regular e do verde do Bom */
.no.q-r.ap-reg{background:#ECF0ED;border-color:#7E9486;color:#3A4D41}
.no-q.ap-reg-t{color:#3A4D41}
.dot.q-r.ap-reg{background:#7E9486;border-color:#5E7567}
.dashed{border-style:dashed}
.tr{display:grid;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #EFEBF4;background:#fff}
.th{background:#FAF8FD;font-size:12px;font-weight:600;color:var(--mut)}
.proj-row{grid-template-columns:1.2fr .5fr .6fr 2.4fr .8fr .9fr}
.esc-row{grid-template-columns:1.6fr .9fr .8fr 1.1fr 1fr 1fr .7fr .9fr .9fr}
.tr.open{background:#FAF8FD}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#E8E5EE}.stack i{display:block;height:100%}
.bar-row{display:grid;grid-template-columns:70px 1fr 40px 110px;gap:10px;align-items:center;padding:4px 0}
.bar-l{font-weight:500}.bar-t{height:10px;border-radius:5px;background:#E8E5EE;overflow:hidden}.bar-t i{display:block;height:100%;border-radius:5px}
.vel-row{display:grid;grid-template-columns:200px 1fr 120px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid #F1EEF5}
.vel-b{display:flex;flex-direction:column;gap:4px}.vel-n{font-weight:500}
.tend{font-size:11px;font-weight:600}.tend.up{color:#14693C}.tend.down{color:#9B1C1C}
.detalhe{padding:16px 18px 22px;background:#FAF8FD;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:14px}
.it .it-v{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:1px solid}
.warn-box{font-size:13px;color:#7A4B00;background:#FCEBC5;border-radius:10px;padding:10px 14px}
.info-box{font-size:12px;color:#4A4458;background:var(--roxo-cl);border-radius:10px;padding:10px 14px}
.ok-box{font-size:14px;font-weight:500;color:#14693C;background:#DDF3E5;border-radius:10px;padding:14px 18px}
.dash-box{font-size:13px;color:#4A4458;background:#fff;border:1px dashed var(--bd2);border-radius:10px;padding:18px}
.aviso{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#DDF3E5;color:#14693C;border-radius:10px;padding:10px 14px;font-weight:500}
.panel{background:#fff;border:2px solid var(--roxo);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.drop{border:2px dashed var(--bd2);border-radius:12px;padding:26px;text-align:center;background:#FAF8FD;color:#4A4458}
.drop.over,body.dragging .drop{border-color:var(--roxo);background:var(--roxo-cl)}
.empty{padding:48px 24px}
.t-card{font-size:15px;font-weight:600;color:var(--roxo-esc)}
.opt{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:10px;border:1px solid var(--bd2);background:#fff;cursor:pointer}
.opt.on{background:var(--roxo-cl);border-color:var(--roxo)}
.opt i{width:18px;height:18px;border-radius:4px;border:2px solid var(--roxo);display:inline-block;background:#fff}.opt.on i{background:var(--roxo)}
/* cards de ponto / rede cabeada */
.pt-card{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1.5px solid;min-height:44px;font-size:13px}
.pt-t{font-size:12px;font-weight:700;color:var(--roxo)}
.ln{display:flex;justify-content:space-between;gap:10px}.ln .lv{text-align:right;overflow-wrap:anywhere}
.pt-q{font-size:12px;font-weight:700}
.pt-card.q-b .pt-q{color:var(--b-fg)}.pt-card.q-r .pt-q{color:var(--r-fg)}.pt-card.q-f .pt-q{color:var(--f-fg)}.pt-card.q-n .pt-q{color:var(--n-fg)}
.pt-extra{display:none;flex-direction:column;gap:6px;border-top:1px solid currentColor;padding-top:8px;font-size:12px}
.pt-card:hover .pt-extra,.pt-card:focus-visible .pt-extra,.pt-card.pinned .pt-extra{display:flex}
.pt-card:hover .pt-hint,.pt-card.pinned .pt-hint{display:none}
/* topologia */
.topo{align-items:center;padding:18px}
.tier{display:flex;flex-direction:column;align-items:center;width:100%}
.tier-n{margin-bottom:6px;letter-spacing:.04em}
.conn{display:flex;flex-direction:column;align-items:center;gap:2px}.conn i{display:block;width:2px;height:16px;background:var(--roxo)}
.no{min-height:44px;min-width:180px;max-width:260px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:10px;border:1.5px solid;margin:2px}
.no.sel{border-width:4px;padding:7.5px 11.5px}.no.miss{border-style:dashed;background:#fff}.no.neutro{background:#F1EFF5;border-color:var(--bd2);color:#4A4458}
.no-tipo{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--mut)}.no-t{font-size:14px;font-weight:600;color:var(--txt)}.no-t.nr{color:var(--mut);font-style:italic}.no-q{font-size:11px;font-weight:700}
.sel-box{border:2px solid var(--roxo)}
/* listas de sugestões */
.lista{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.l-row{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #EFEBF4}
.l-risco{border-left:5px solid #D99A2B;background:#FFFCF5}.l-rec{border-left:5px solid #3D6A9E;background:#F7FAFD}
.l-tag{flex:0 0 96px;font-size:11px;font-weight:700;color:#8A5A00;letter-spacing:.04em;padding-top:2px}
.l-txt{flex:1 1 300px;font-size:13px;line-height:1.45}
.l-col{flex:1 1 320px;display:flex;flex-direction:column;gap:6px}
.l-op{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}.l-opk{flex:0 0 190px;font-size:12px;font-weight:700}
/* histórico */
.hbars{display:flex;gap:8px;align-items:flex-end;height:130px;border-bottom:1px solid var(--bd);padding-top:4px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}.hbar{width:70%;max-width:44px;border-radius:5px 5px 0 0}
.hdt{flex:1;text-align:center;font-size:10.5px;color:var(--mut)}
/* fotos */
.foto{cursor:pointer;text-align:left;min-height:44px}.img-box{height:130px;background:#E8E5EE;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb{max-width:100%;max-height:100%;object-fit:cover;width:100%;height:100%}.big{max-width:100%;max-height:520px;border-radius:8px}.img-big{display:flex;justify-content:center;background:#E8E5EE;border-radius:10px;padding:8px}
.foto-n{padding:10px 12px;font-size:13px;font-weight:500}
.pdf-frame{width:100%;height:720px;border:1px solid var(--bd);border-radius:8px;background:#fff}
@media(max-width:900px){
  .wrap-app{padding:16px}
  .tr.esc-row,.tr.proj-row{grid-template-columns:1fr 1fr}.th{display:none}
  .vel-row{grid-template-columns:1fr}.bar-row{grid-template-columns:60px 1fr 36px}
  .bar-row .small{display:none}
}
@media print{.btn,.chip,#nav{display:none}.pt-extra{display:flex}}

.tr.row{display:flex}
.card.hist-card{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.l-col .l-txt{flex:0 0 auto}

details.mais{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
details.mais summary{cursor:pointer;font-weight:600;color:var(--roxo);font-size:13px;min-height:28px}
details.mais[open] summary{margin-bottom:10px}
details.mais .tec{margin-top:10px;word-break:break-all}

.menu-dados{position:relative}
.md-lista{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:290px;background:#fff;border:1px solid var(--bd2);border-radius:12px;box-shadow:0 8px 24px rgba(31,26,43,.16);padding:6px;display:flex;flex-direction:column;gap:2px}
.md-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:#fff;border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer;color:var(--txt);font:inherit}
.md-item:hover:not(:disabled),.md-item:focus-visible{background:var(--roxo-cl)}
.md-item:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:600px){.md-lista{right:auto;left:0;min-width:260px}}

/* topologia em ramos: da distribuição saem a rede cabeada e o Wi-Fi */
.no{position:relative}
.no-ic{position:absolute;top:9px;right:10px}
.no .no-tipo,.no .no-t{padding-right:28px}
.ramos{display:grid;grid-template-columns:1fr 1fr;width:100%;position:relative}
.ramos::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--roxo)}
.ramo{display:flex;flex-direction:column;align-items:center;padding:0 10px;min-width:0}
.ramo .tier:first-child .conn{margin-top:-0px}
.ramo-cab .tier-n{color:#2A4F7A}.ramo-wifi .tier-n{color:#5B2A86}
@media (max-width:760px){.ramos{grid-template-columns:1fr}.ramos::before{display:none}.ramo+.ramo{margin-top:12px;border-top:2px dashed var(--bd2);padding-top:8px}}

/* visualização ampliada de foto e print */
.lightbox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.lb-bg{position:absolute;inset:0;background:rgba(20,14,30,.78)}
.lb-card{position:relative;background:#fff;border-radius:14px;max-width:min(96vw,1100px);max-height:94vh;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:hidden}
.lb-img{display:flex;justify-content:center;align-items:center;background:#E8E5EE;border-radius:10px;overflow:auto;min-height:120px}
.lb-pic{display:block;max-width:100%;max-height:calc(94vh - 110px);width:auto;height:auto;object-fit:contain}
.lb-bar{padding:0 2px}
@media (max-width:600px){.lb-card{padding:8px}.lb-bar .btn{padding:0 12px}}
.img-box.tall{height:210px}.img-box.tall .thumb{object-fit:contain}

/* cards da topologia: 3 por linha (2 em tela estreita), centralizados */
.nos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.nos .no{flex:0 1 calc((100% - 16px) / 3);min-width:0;max-width:260px;margin:0;overflow-wrap:break-word}
.nos .no:only-child{flex-basis:min(100%,260px)}
@media (max-width:520px){.nos .no{flex-basis:calc((100% - 8px) / 2)}.nos .no:only-child{flex-basis:min(100%,260px)}}

/* cards do Resumo com ícone no canto */
.it{position:relative}
.it .it-ic{position:absolute;top:12px;right:14px;color:var(--roxo);opacity:.85}
.it .small.muted{padding-right:30px}

/* ranking de velocidade: 3 melhores e 3 piores lado a lado */
.g-rank{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rk-t{margin-bottom:8px}.rk-t.rk-bom{color:#14693C}.rk-t.rk-ruim{color:#2A4F7A}
.rk-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #F1EEF5}
.rk-row:last-child{border-bottom:0}
.rk-n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;color:#fff}
.rk-n.rk-bom{background:#14693C}.rk-n.rk-ruim{background:#2A4F7A}
.rk-esc{font-weight:500;overflow-wrap:anywhere}
.rk-v{white-space:nowrap}
@media (max-width:700px){.g-rank{grid-template-columns:1fr}}

.rk-row{width:100%;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px;min-height:44px}
.rk-row:hover,.rk-row:focus-visible{background:var(--roxo-cl)}
.rk-row:focus-visible{outline:3px solid #9A6BC4;outline-offset:1px}

/* ── Visão gestão: igual ao mockup aprovado (acréscimo; prefixo gv-) ──────────

.gv{background:#F4F1F8;color:#1D1530;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
.gv *{box-sizing:border-box}
.gv h1,.gv h2,.gv h3,.gv h4{margin:0;color:inherit}
.gv button{font-family:inherit}
.gv a{text-decoration:none}
.gv .num{font-variant-numeric:tabular-nums}
.gv-r{text-align:right}
.gv-band{background:#2E1250;color:#fff}
.gv-band-in{position:relative;max-width:1280px;margin:0 auto;padding:22px 32px 0;display:flex;flex-direction:column;gap:18px}
.gv-band-in.fim{padding-bottom:28px}
.gv-ver{position:absolute;top:6px;right:32px;font-size:11px;line-height:14px;letter-spacing:.03em;color:#B9A5D6;opacity:.85;pointer-events:none;user-select:none}
.gv-ver.cl{position:static;margin-left:10px;font-size:12px;font-weight:500;color:var(--mut);opacity:1;vertical-align:middle;letter-spacing:0}
.gv-band-in.ficha{padding:20px 32px 26px;gap:14px}
.gv-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.gv-top.mid{align-items:center}
.gv-hd{display:flex;flex-direction:column;gap:4px;min-width:0}
.gv-kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CDBBE6}
.gv-t1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gv-title{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.gv-sub{font-size:14px;color:#CDBBE6}
.gv-bk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #6E4A9E;background:transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.gv-bk:hover,.gv-bo:hover{background:#44207A}
.gv-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gv-bw{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#fff;color:#2E1250;font-size:14px;font-weight:700;cursor:pointer}
.gv-bw:hover{background:#EFE7F7}
.gv-bw[disabled]{opacity:.5;cursor:not-allowed}
.gv-bo{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #6E4A9E;background:transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.gv-band .menu-dados .btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #6E4A9E;background:transparent;color:#fff;font-size:14px;font-weight:600}
.gv-band .menu-dados .btn:hover{background:#44207A}
.gv-tabs{display:flex;gap:4px;overflow-x:auto}
.gv-tab{min-height:46px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:#CDBBE6;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.gv-tab.on{border-bottom-color:#fff;color:#fff;font-weight:700}
.gv-bk:focus-visible,.gv-bw:focus-visible,.gv-bo:focus-visible,.gv-tab:focus-visible,.gv-btn:focus-visible,.gv-chip:focus-visible,.gv-link:focus-visible,.gv-crumb:focus-visible{outline:3px solid #B9A0DB;outline-offset:2px}
.gv-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:#CDBBE6}

<script>
/* Regras de qualidade e sugestões de melhoria.
 * Espelham o app (MedicaoScreen.kt, MatrizConfig.kt, MatrizCalculo.kt e DiagnosticoHelper.kt).
 * Os limites abaixo são os valores padrão do app; se mudarem no app, ajuste aqui.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PainelRegras = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var LIM = {
    wifi: { dlRuim: 40, dlRegular: 80, pingRuim: 100, pingRegular: 50, jitter: 30 },
    cabeada: { dlRuim: 50, dlRegular: 90, pingRuim: 80, pingRegular: 40, jitter: 30 },
    nota: { aprovada: 80, ressalva: 51 }
  };

  // k: b = bom (verde), r = regular (amarelo), f = ruim (vermelho), n = sem dado
  var NOMES = { b: 'Bom', r: 'Regular', f: 'Ruim', n: 'Não registrado' };

  function ok(n) { return typeof n === 'number' && isFinite(n); }

  function qualidadeWifi(dl, ping, jit) {
    var L = LIM.wifi;
    if (!ok(dl) || !ok(ping)) return { k: 'n', l: NOMES.n, motivo: 'O Wi-Fi não foi medido nesta vistoria.' };
    var j = ok(jit) ? jit : 0;
    var m = [];
    if (dl <= L.dlRuim || ping > L.pingRuim || j > L.jitter) {
      if (dl <= L.dlRuim) m.push('download até ' + L.dlRuim + ' Mbps');
      if (ping > L.pingRuim) m.push('ping acima de ' + L.pingRuim + ' ms');
      if (j > L.jitter) m.push('jitter acima de ' + L.jitter + ' ms');
      return { k: 'f', l: 'Ruim', motivo: 'Ruim por: ' + m.join(', ') + '.' };
    }
    if (dl <= L.dlRegular || ping > L.pingRegular) {
      if (dl <= L.dlRegular) m.push('download até ' + L.dlRegular + ' Mbps');
      if (ping > L.pingRegular) m.push('ping acima de ' + L.pingRegular + ' ms');
      return { k: 'r', l: 'Regular', motivo: 'Regular por: ' + m.join(', ') + '.' };
    }
    return { k: 'b', l: 'Bom', motivo: 'Download acima de ' + L.dlRegular + ' Mbps, ping até ' + L.pingRegular + ' ms e jitter até ' + L.jitter + ' ms.' };
  }

  function qualidadeCabeada(dl, ping, jit) {
    var L = LIM.cabeada;
    if (!ok(dl)) return { k: 'n', l: NOMES.n, motivo: 'Rede cabeada não medida.' };
    var m = [];
    var pOk = ok(ping), jOk = ok(jit);
    if (dl <= L.dlRuim || (pOk && ping > L.pingRuim) || (jOk && jit > L.jitter)) {
      if (dl <= L.dlRuim) m.push('download até ' + L.dlRuim + ' Mbps');
      if (pOk && ping > L.pingRuim) m.push('ping acima de ' + L.pingRuim + ' ms');
      if (jOk && jit > L.jitter) m.push('jitter acima de ' + L.jitter + ' ms');
      return { k: 'f', l: 'Ruim', motivo: 'Ruim por: ' + m.join(', ') + '.' };
    }
    if (dl <= L.dlRegular || (pOk && ping > L.pingRegular)) {
      if (dl <= L.dlRegular) m.push('download até ' + L.dlRegular + ' Mbps');
      if (pOk && ping > L.pingRegular) m.push('ping acima de ' + L.pingRegular + ' ms');
      return { k: 'r', l: 'Regular', motivo: 'Regular por: ' + m.join(', ') + '.' };
    }
    return { k: 'b', l: 'Bom', motivo: 'Download acima de ' + L.dlRegular + ' Mbps e ping até ' + L.pingRegular + ' ms.' };
  }

  // Nível do sinal em dBm (mesma régua do app)
  function qualidadeSinal(dbm) {
    if (!ok(dbm) || dbm === 0) return { k: 'n', l: NOMES.n, nivel: 'não registrado' };
    if (dbm >= -50) return { k: 'b', l: 'Excelente', nivel: 'excelente' };
    if (dbm >= -60) return { k: 'b', l: 'Muito bom', nivel: 'muito bom' };
    if (dbm >= -70) return { k: 'r', l: 'Bom', nivel: 'bom' };
    if (dbm >= -80) return { k: 'f', l: 'Ruim', nivel: 'ruim' };

  function qualidadeCabos(t) {

  function qualidadeLink(mbps) {
    if (!ok(mbps) || mbps <= 0) return { k: 'n', l: NOMES.n };

  function faixaDaNota(nota, wifiNaoMedido, navegabilidadeZero) {
    if (!ok(nota)) return 'nm';
    if (navegabilidadeZero) return 'rp';

    re: { l: 'Com ressalva', bg: '#FCEBC5', fg: '#7A4B00' },
    rp: { l: 'Reprovada', bg: '#FAD9D9', fg: '#9B1C1C' },

      { k: 'Equilíbrio Técnico/Financeiro', v: b, fg: '#2A4F7A' },

    // Link de internet
    if (links.length) {
      var todosAbaixo = links.every(function (l) { return ok(l.mbps) && l.mbps < 1000; });
      if (todosAbaixo) riscos.push({ tag: 'LINK', t: 'Nenhum dos links de internet contratados atinge 1 Gbps. Para extrair o melhor desempenho do ambiente de DaaS, recomendamos o upgrade do link para 1 Gbps.' });

      recs.push({ tit: 'Switch 10/100', corpo: "A tecnologia atual dos aparelhos de rede limita a velocidade da internet. Recomendamos a atualização para aparelhos 'Gigabit' para que as atividades digitais fluam sem travamentos.", ops: opcoes('Ubiquiti UniFi Switch Standard (24 ou 48 portas)', 'TP-Link JetStream (Série TL-SG3400)', 'Intelbras SG 2404 MR') });

    if (cabosRuins) {
      riscos.push({ tag: 'CABOS', t: 'Foram identificados cabos danificados, soltos ou com emendas visíveis na rede. Isso pode causar quedas de sinal intermitentes e instabilidade nas conexões.' });
      recs.push({ tit: 'Cabos Danificados', corpo: 'Identificamos desgastes na fiação que podem causar quedas de sinal. Recomendamos a renovação dos cabos para garantir a segurança e a continuidade das aulas sem interrupções.', ops: opcoes('Furukawa GigaLan Cat6', 'Nexans Essential Cat6', 'Furukawa SOHOplus Cat6') });
    }

    // Gateway
    if (/modem da operadora/i.test(txt(infra.gateway))) {
      riscos.push({ tag: 'GATEWAY', t: 'O hardware de padrão residencial fornecido pela operadora é insuficiente para suportar a densidade de conexões exigida, gerando latência excessiva e desconexões nas máquinas virtuais.' });
      recs.push({ tit: 'Modem da Operadora (Gateway)', corpo: 'O modem da operadora é de uso doméstico e fica sobrecarregado com muitos alunos. Recomendamos um roteador profissional para garantir uma conexão segura e organizada para todos.', ops: opcoes('Ubiquiti Dream Machine Pro (UDM-Pro)', 'MikroTik RB5009 ou hEX (RB750Gr3)', 'TP-Link Omada ER605') });
    }

    // Densidade de APs
    if (/corredor\s*\/\s*distante/i.test(txt(infra.densidadeAps))) {
      riscos.push({ tag: 'WI-FI', t: 'Antenas apenas nos corredores comprometem a cobertura dentro das salas, gerando um sinal fraco e instável. Isso cria uma disputa por conexão entre salas vizinhas.' });
      recs.push({ tit: 'APs no Corredor / Distante', corpo: 'O sinal de Wi-Fi encontra dificuldades para chegar às salas. Para que todos os alunos se conectem com estabilidade, o ideal é a instalação de uma antena dentro de cada sala de aula.', ops: opcoes('Ubiquiti UniFi 6 Plus (U6+)', 'TP-Link Omada EAP610', 'TP-Link Omada EAP225') });
    } else if (vazio(infra.densidadeAps)) naoAvaliado.push('densidade de APs');

    // Desempenho medido
    var ping = wifi.mediaPing, dl = wifi.mediaDownload;
    if (ok(ping) && ping > 100) riscos.push({ tag: 'DESEMPENHO', t: 'Alta latência (ping acima de 100 ms) pode causar atrasos significativos na resposta do mouse e teclado, além de degradação na qualidade da imagem (tela pixelada).' });
    if (ok(dl) && dl > 0) {
      if (dl <= 30) riscos.push({ tag: 'DESEMPENHO', t: 'Inviável o uso de DaaS com a conexão atual: 30 Mbps não comportam 20 acessos simultâneos. A baixa capacidade de rede causa lentidão extrema e travamentos imediatos para todos os usuários.' });
      else if (dl <= 40) riscos.push({ tag: 'DESEMPENHO', t: 'Rede comporta no máximo 1 turma em simultâneo.' });
      else if (dl <= 80) riscos.push({ tag: 'DESEMPENHO', t: 'Rede comporta no máximo 2 turmas em simultâneo.' });
    }
    return { riscos: riscos, recs: recs, naoAvaliado: naoAvaliado, total: riscos.length + recs.length };
  }

  return {
    LIM: LIM, FAIXAS: FAIXAS, NOMES: NOMES,
    qualidadeWifi: qualidadeWifi, qualidadeCabeada: qualidadeCabeada, qualidadeSinal: qualidadeSinal,
    qualidadeSwitch: qualidadeSwitch, qualidadeGateway: qualidadeGateway, qualidadeCabos: qualidadeCabos,
    qualidadeDensidade: qualidadeDensidade, qualidadeEspectro: qualidadeEspectro, qualidadeLink: qualidadeLink,
    faixaDaNota: faixaDaNota, gerarSugestoes: gerarSugestoes
  };
});

(function (root, factory) {

  'use strict';

    if (!tamanho) return null;
    var t = String(tamanho).toLowerCase().replace(',', '.');

  // Chave para comparar nomes de escola: vale o nome próprio, o final do nome. O tipo no começo ("E.M", "EM", "ESCOLA MUNICIPAL",

  var TIPOS = [
    'escola municipal de educacao infantil', 'escola municipal de ensino fundamental', 'centro municipal de educacao infantil',
    'centro de educacao infantil', 'escola municipal', 'educacao infantil', 'e m e f', 'e m e i', 'emef', 'emei', 'cmei', 'cei',
    'e m', 'em', 'ei', 'escola', 'creche', 'colegio', 'tempo integral', 'integral', 'de', 'da', 'do', 'das', 'dos', 'e'

        } else campo += c;

  function dataBr(txt) { // "dd/MM/yyyy HH:mm" -> ms (horário local)

        });

      var faixa = (wifiNaoMedido && !possuiRede) ? 'nm' : R.faixaDaNota(nota, wifiNaoMedido, navZero);

 *  4. Mesmo pacote (pacoteId) carregado duas vezes: ignorado inteiro.

 * entram no mesmo grupo; as medições mais antigas viram histórico.

    var h = '<div class="grid g-kpi">' + kpis.map(function (k) {

      return { p: p, t: t, ap: c('ap'), re: c('re'), rp: c('rp'), nm: nm, nmn: c('nm'), compl: Math.round(l.filter(function (e) { return e.ultima.campos === 'completa'; }).length / t * 100) };
    }).sort(function (a, b) { return (a.nm == null ? 999 : a.nm) - (b.nm == null ? 999 : b.nm); });
    var w = function (x, t) { return t ? (x / t * 100).toFixed(0) + '%' : '0%'; };
    h += '<h2>Qualidade por projeto</h2><div class="card nopad"><div class="tr th proj-row"><span>Projeto</span><span>Escolas</span><span>Nota média</span><span>Distribuição</span><span>Dados completos</span><span></span></div>' +

  // ══ Visão por projeto ═════════════════════════════════════════════════════════

  function tendencia(e) {

  // ══ Detalhe da vistoria ═══════════════════════════════════════════════════════
  var ABAS = [

  // ícones dos cards do Resumo (traços simples, herdam a cor do card)

<script>
/* Camada de gestão: contas da visão executiva, do projeto e da ficha da escola.
 *
 * REGRA PÉTREA: este arquivo só LÊ. Recebe as escolas já agrupadas por dados.js e devolve números novos.
 * Nunca altera uma vistoria, nunca chama adicionar/limpar do banco, nunca recalcula nota ou faixa.
 * Dado que falta fica fora da conta (null), nunca vira zero.

(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./regras.js'), require('./normalizar.js'));

})(typeof self !== 'undefined' ? self : this, function (R, N) {
  'use strict';

  var ok = N.ok;

  // ── rótulos de gestão (só texto; a régua de 80 / 51 / 50 é a do app) ──────────
  var ROTULOS = { apr: 'Apta com ressalva', ap: 'Apta', re: 'Com ajustes', rp: 'Severas restrições', nm: 'Sem nota' };
  var ROTULO_MISTA = 'Apta com ressalva';
  var CORES = {

  };
  // Faixa de cada parte, lida do status que o app gravou (nada é recalculado).
  function faixaParte(st) {

    var c = v.calculado || {}, w = faixaParte(c.statusWifi), r = faixaParte(c.statusCabeada);

  }
  var TIPOS = { hib: 'Wi-Fi e rede física', wifi: 'Só Wi-Fi', fis: 'Só rede física', nenhum: 'Sem medição' };

  // ── formatação ───────────────────────────────────────────────────────────────

  function pct(n, t) { return (t ? Math.round(n / t * 100) : 0) + '%'; }

  function mediaDe(arr) { var v = arr.filter(ok); return v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : null; }
  function txt(s) { return s == null ? '' : String(s); }

  // Nome para exibir: nome escrito só em maiúsculas vira "Nome Próprio" (só na tela, o dado não muda)
  var SIGLAS = { CEI: 1, CMEI: 1, CEIM: 1, EMEI: 1, EMEF: 1, EM: 1, EE: 1, EJA: 1, CEEBJA: 1, SEMED: 1, II: 1, III: 1 };
  var MIUDAS = { DA: 1, DE: 1, DO: 1, DAS: 1, DOS: 1, E: 1, A: 1, O: 1 };
  function nomeEscola(nome) {
    var t = txt(nome);

    var primeiro = true;
    return t.replace(/[^\s\/]+/g, function (w) {

  // ── tipo de rede medida, pela medição mais recente ───────────────────────────
  function temWifi(v) {

  // ── uma linha por escola (medição mais recente), sem alterar nada ───────────

        dlFis: mediaDe(redes.map(function (r) { return r.download; })), medicoes: e.serie.length

  function doProjeto(linhas, nome) { return linhas.filter(function (l) { return l.projeto === nome; }); }

  function resumo(linhas) {
    var m = medidas(linhas);
    var por = function (f) { return m.filter(function (l) { return l.faixa === f; }); };

    var comAlunos = m.filter(function (l) { return l.alunos != null; });
    var comPing = m.filter(function (l) { return l.ping != null; });
    return {
      total: linhas.length, n: m.length, semNota: linhas.length - m.length,
      p: P.length, a: A.length, b: B.length, pr: PR.length, pp: PP.length,
      alPR: soma(PR, function (l) { return l.alunos; }), alPP: soma(PP, function (l) { return l.alunos; }),
      alP: soma(P, function (l) { return l.alunos; }), alA: soma(A, function (l) { return l.alunos; }), alB: soma(B, function (l) { return l.alunos; }),
      alunos: soma(m, function (l) { return l.alunos; }), nComAlunos: comAlunos.length,
      notaMedia: m.length ? Math.round(mediaDe(m.map(function (l) { return l.nota; }))) : null,
      nHib: m.filter(function (l) { return l.tipo === 'hib'; }).length,
      nWifi: m.filter(function (l) { return l.tipo === 'wifi'; }).length,
      nFis: m.filter(function (l) { return l.tipo === 'fis'; }).length,
      nComFisica: m.filter(function (l) { return l.tipo === 'hib' || l.tipo === 'fis'; }).length,
      latAlta: comPing.filter(function (l) { return l.ping > R.LIM.wifi.pingRegular; }).length, comPing: comPing.length

  function periodo(escolas) {
    var ds = [];

    if (!ds.length) return null;

  }

  // ── todos os projetos ────────────────────────────────────────────────────────
  function visaoGeral(escolas) {
    var linhas = linhasDe(escolas);
    var nomes = [];
    linhas.forEach(function (l) { if (nomes.indexOf(l.projeto) < 0) nomes.push(l.projeto); });
    var projetos = nomes.map(function (nome) {
      var ls = doProjeto(linhas, nome);
      var es = ls.map(function (l) { return l.e; });
      return { nome: nome, linhas: ls, resumo: resumo(ls), periodo: periodo(es), medicoes: es.reduce(function (s, e) { return s + e.serie.length; }, 0) };
    }).sort(function (a, b) {
      return (b.resumo.alB - a.resumo.alB) || (b.resumo.b - a.resumo.b) || (a.nome < b.nome ? -1 : 1);
    });
    var geral = resumo(linhas);
    var top2 = projetos.filter(function (p) { return p.resumo.alB > 0; }).slice(0, 2);
    var frases = textoGeral(geral, top2);
    return { linhas: linhas, projetos: projetos, geral: geral, frases: frases };
  }

  function textoGeral(r, top2, comEscolas) {
    var f = {};
    if (!r.n) { f.manchete = 'Ainda não há escola com nota para resumir.'; f.l1 = ''; f.l2 = ''; f.l3 = ''; return f; }
    var esc1 = r.n === 1;
    f.manchete = r.p === 0
      ? (esc1 ? 'Ainda não há escola apta para VDI entre as medidas' : 'Ainda não há escola apta para VDI entre as ' + r.n + ' medidas') + '.'
      : 'Hoje ' + r.p + ' de ' + r.n + (esc1 ? ' escola medida já sustenta' : ' escolas medidas já sustentam') + ' VDI' + (r.alP > 0 ? ', com ' + milhar(r.alP) + ' alunos' : '') + '.';
    var outras = [];
    if (r.a > 0) outras.push((r.p > 0 ? (r.a === 1 ? 'Outra funciona' : 'Outras ' + r.a + ' funcionam') : (r.a === 1 ? '1 escola funciona' : r.a + ' escolas funcionam')) + ' com ajustes.');
    if (r.b > 0) outras.push((r.b === 1 ? '1 ainda pede' : r.b + ' ainda pedem') + ' intervenção' + (r.alB > 0 ? ' e ' + (r.b === 1 ? 'concentra ' : 'concentram ') + milhar(r.alB) + ' alunos' + (r.alunos ? ', ' + pct(r.alB, r.alunos) + ' do total' : '') : '') + '.');
    f.l1 = outras.join(' ');
    f.l2 = top2.length >= 2 && r.alB > 0
      ? top2[0].nome + ' e ' + top2[1].nome + ' juntos têm ' + pct(top2[0].resumo.alB + top2[1].resumo.alB, r.alB) + ' dos alunos em escolas com severas restrições.'
      : (top2.length === 1 ? top2[0].nome + ' concentra os alunos em escolas com severas restrições.' : '');
    f.l3 = r.nComFisica
      ? (r.nComFisica === r.n ? 'Todas as ' + r.n + ' escolas têm rede física medida.' : r.nComFisica + ' das ' + r.n + ' escolas têm rede física medida. Nas demais vale só o Wi-Fi.')
      : 'Nenhuma escola tem rede física medida até agora. A nota é só do Wi-Fi.';

  }

  // ── causas e plano de ação ───────────────────────────────────────────────────
  function numProf(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; }
  function fastEmAlgum(v) {
    var i = v.infra || {}, c = v.cabeada || {};
    var re = /fast\s*10\/100/i;
    return re.test(txt(i.switch)) || (c.redes || []).some(function (r) { return re.test(txt(r.switch)); }) || re.test(txt(c.legadoSwitch));
  }

  var CAUSAS = [
    { id: 'gateway', nome: 'Gateway é o modem da operadora',
      porque: 'O modem da operadora costuma limitar a rede e não deixa ajustar a configuração.',
      acao: 'Instalar um gateway próprio da escola, com configuração controlada.',
      teste: function (v) { return /modem da operadora/i.test(txt((v.infra || {}).gateway)); } },
    { id: 'prof', nome: 'Professores deram nota 5 ou menos',
      porque: 'É a percepção de quem usa. O Wi-Fi instável aparece na sala antes de aparecer na medição.',
      acao: 'Ouvir os professores e tratar as queixas junto com a correção técnica.',
      teste: function (v) { var n = numProf((v.infra || {}).notaProfessor); return n !== null && n <= 5; } },
    { id: 'lat', nome: 'Latência acima de 50 ms',
      porque: 'Acima de 50 ms o desktop virtual atrasa o clique e a digitação.',
      acao: 'Verificar o link e o caminho até a operadora.',
      teste: function (v) { var p = (v.wifi || {}).mediaPing; return ok(p) && p > R.LIM.wifi.pingRegular; } },
    { id: 'aps', nome: 'APs no corredor, longe das salas',
      porque: 'O sinal chega fraco dentro das salas, onde os alunos usam.',
      acao: 'Reposicionar os APs perto das salas.',
      teste: function (v) { return R.qualidadeDensidade((v.infra || {}).densidadeAps).k === 'f'; } },
    { id: 'dl', nome: 'Download médio abaixo de 25 Mbps',
      porque: 'Com pouca banda, poucos alunos ao mesmo tempo já saturam a conexão.',
      acao: 'Revisar o contrato de banda com a operadora.',

    { id: 'switch', nome: 'Switch 10/100 ou não identificado',

      acao: 'Trocar por switch gigabit e identificar o equipamento.',

      porque: 'Faixa mais congestionada e mais lenta, com mais interferência.',
      acao: 'Trocar os APs por dual-band.',
      teste: function (v) { return R.qualidadeEspectro((v.infra || {}).espectroWifi).k === 'f'; } }

  var ORDEM_PRINCIPAL = ['lat', 'dl', 'switch', 'esp24', 'aps', 'gateway', 'prof', 'imped'];

  function causasDaEscola(v) {
    return CAUSAS.filter(function (c) { try { return !!c.teste(v); } catch (e) { return false; } });
  }

  function causaPrincipal(v) {
    var ativas = causasDaEscola(v).map(function (c) { return c.id; });
    for (var i = 0; i < ORDEM_PRINCIPAL.length; i++) if (ativas.indexOf(ORDEM_PRINCIPAL[i]) >= 0) return CAUSAS.filter(function (c) { return c.id === ORDEM_PRINCIPAL[i]; })[0];
    return null;
  }

  function causasDoProjeto(linhas) {
    var m = medidas(linhas);
    return CAUSAS.map(function (c, idx) {
      var alvo = m.filter(function (l) { try { return !!c.teste(l.v); } catch (e) { return false; } });
      return { id: c.id, nome: c.nome, porque: c.porque, acao: c.acao, qtd: alvo.length, de: m.length, escolas: alvo.map(function (l) { return l.nome; }), idx: idx };
    }).filter(function (c) { return c.qtd > 0; }).sort(function (a, b) { return (b.qtd - a.qtd) || (a.idx - b.idx); });
  }

  // ── listas de apoio ──────────────────────────────────────────────────────────
  function prioridade(linhas, n) {
    return medidas(linhas).filter(function (l) { return l.nota < R.LIM.nota.aprovada; })
      .sort(function (a, b) { return ((b.alunos || 0) * (100 - b.nota)) - ((a.alunos || 0) * (100 - a.nota)) || (a.nota - b.nota); })
      .slice(0, n)
      .map(function (l, i) {
        var c = causaPrincipal(l.v);
        return { pos: i + 1, l: l, causa: c ? c.nome : 'Sem causa registrada', acao: c ? c.acao : 'Rever os dados da vistoria com o técnico.' };
      });
  }
  function referencias(linhas, n) {
    return medidas(linhas).slice().sort(function (a, b) { return b.nota - a.nota; }).slice(0, n);
  }
  function porTipo(linhas, tipo) {
    return linhas.filter(function (l) { return tipo === 'todas' || !tipo || l.tipo === tipo; });
  }
  function contagemTipos(linhas) {
    var m = medidas(linhas);
    return {
      todas: m.length,
      wifi: m.filter(function (l) { return l.tipo === 'wifi'; }).length,
      hib: m.filter(function (l) { return l.tipo === 'hib'; }).length,

  // Notas das escolas que têm rede física e Wi-Fi: mostra como a nota geral é formada
  function composicaoNota(linhas) {
    return medidas(linhas).filter(function (l) { return l.tipo === 'hib' && l.notaWifi != null && l.notaFis != null; })
      .sort(function (a, b) { return a.nota - b.nota; });
  }

  // ── histórico: rodadas e evolução ────────────────────────────────────────────
  var DIA = 86400000, CORTE_RODADA_DIAS = 21;

  function rodadas(linhas) {
    var itens = [];
    linhas.forEach(function (l) {
      l.e.serie.forEach(function (v) { if (ok(v.data)) itens.push({ data: v.data, v: v, escola: l.chave }); });
    });
    itens.sort(function (a, b) { return a.data - b.data; });
    var grupos = [];
    itens.forEach(function (it) {
      var g = grupos[grupos.length - 1];
      if (g && it.data - g.fim <= CORTE_RODADA_DIAS * DIA) { g.itens.push(it); g.fim = it.data; }
      else grupos.push({ ini: it.data, fim: it.data, itens: [it] });
    });
    return grupos.map(function (g, i) {
      var notas = g.itens.map(function (x) { return x.v.calculado && x.v.calculado.nota; }).filter(ok);
      var cont = function (f) { return g.itens.filter(function (x) { return x.v.calculado && x.v.calculado.faixa === f && ok(x.v.calculado.nota); }).length; };
      var esc = {}; g.itens.forEach(function (x) { esc[x.escola] = 1; });
      return { n: i + 1, ini: g.ini, fim: g.fim, medicoes: g.itens.length, escolas: Object.keys(esc).length,
        notaMedia: notas.length ? Math.round(mediaDe(notas)) : null, p: cont('ap'), a: cont('re'), b: cont('rp') };
    });
  }

  function evolucao(linhas) {
    var difs = [];
    linhas.forEach(function (l) {
      var s = l.e.serie; if (s.length < 2) return;
      var ult = s[s.length - 1].calculado.nota, ant = null;
      for (var i = s.length - 2; i >= 0; i--) { if (ok(s[i].calculado.nota)) { ant = s[i].calculado.nota; break; } }
      if (ok(ult) && ant !== null) difs.push(ult - ant);
    });
    if (!difs.length) return null;
    return { n: difs.length, media: mediaDe(difs), melhoraram: difs.filter(function (d) { return d > 0; }).length, pioraram: difs.filter(function (d) { return d < 0; }).length };
  }

  // De onde vieram os números (arquivo de origem das medições mais recentes)
  function fontes(linhas) {
    var mapa = {};
    linhas.forEach(function (l) {
      l.e.serie.forEach(function (v) {
        var plan = v.origem === 'planilha';
        var nome = v.arquivoOrigem || (plan ? 'planilha antiga' : 'pacote');
        var k = (plan ? 'planilha|' : 'pacote|') + nome;
        mapa[k] = mapa[k] || { nome: nome, origem: plan ? 'planilha antiga' : 'pacote do app', plan: plan, qtd: 0 };
        mapa[k].qtd++;
      });
    });
    return Object.keys(mapa).map(function (k) { return mapa[k]; }).sort(function (a, b) { return b.qtd - a.qtd; });
  }

  // ── ficha da escola ──────────────────────────────────────────────────────────
  function ficha(l) {
    var v = l.v, w = v.wifi || {}, pts = w.pontos || [];
    var comDl = pts.filter(function (p) { return ok(p.download); });
    var pior = comDl.length ? comDl.slice().sort(function (a, b) { return a.download - b.download; })[0] : null;
    var redes = ((v.cabeada && v.cabeada.redes) || []).map(function (r) {
      return { nome: r.nome, download: ok(r.download) ? r.download : null, ping: ok(r.ping) ? r.ping : null, qual: R.qualidadeCabeada(r.download, r.ping, r.jitter) };
    });
    var legado = ok(v.cabeada && v.cabeada.legadoDownload) && v.cabeada.legadoDownload > 0;
    if (!redes.length && legado) redes.push({ nome: 'Rede cabeada (registro antigo)', download: v.cabeada.legadoDownload, ping: ok(v.cabeada.legadoPing) ? v.cabeada.legadoPing : null, qual: R.qualidadeCabeada(v.cabeada.legadoDownload, v.cabeada.legadoPing, v.cabeada.legadoJitter) });
    return {
      wifi: l.tipo === 'wifi' || l.tipo === 'hib' ? {
        nota: l.notaWifi, dl: l.dl, ping: l.ping, jitter: mediaDe(pts.map(function (p) { return p.jitter; })), upload: ok(w.mediaUpload) ? w.mediaUpload : null,
        pontos: pts.length, pior: pior, qual: R.qualidadeWifi(l.dl, l.ping, mediaDe(pts.map(function (p) { return p.jitter; })))
      } : null,
      fisica: l.tipo === 'fis' || l.tipo === 'hib' ? { nota: l.notaFis, redes: redes } : null,
      causas: causasDaEscola(v),
      sugestoes: R.gerarSugestoes(v).total
    };
  }


  // ── ficha: texto de diagnóstico, posição no projeto e causas por tipo ─────────
  function dec1(n) { return String(n.toFixed(1)).replace('.', ','); }
  function jitterMedio(v) { return mediaDe(((v.wifi && v.wifi.pontos) || []).map(function (p) { return p.jitter; })); }
  function qualRede(v) {
    var r = ((v.cabeada && v.cabeada.redes) || []).filter(function (x) { return ok(x.download); })[0];
    if (r) return R.qualidadeCabeada(r.download, r.ping, r.jitter);
    var c = v.cabeada || {};
    return ok(c.legadoDownload) && c.legadoDownload > 0 ? R.qualidadeCabeada(c.legadoDownload, c.legadoPing, c.legadoJitter) : { k: 'n', l: R.NOMES.n };
  }
  // Todos os pontos de Wi-Fi mediram 0 Mbps: a escola estava sem conexão na visita (não é medição de qualidade)
  function semRede(v) {
    var pts = (v.wifi && v.wifi.pontos) || [];
    return pts.length > 0 && pts.every(function (p) { return ok(p.download) && p.download <= 0; });
  }
  function diagnostico(l) {
    var v = l.v, w = v.wifi || {};
    var pts = (w.pontos || []).filter(function (p) { return ok(p.download) && ok(p.ping); });
    var fx = l.faixa === 'ap' ? 'está apta' : l.faixa === 're' ? 'funciona com ajustes' : 'tem severas restrições';
    if (l.tipo === 'nenhum') return 'Esta vistoria não tem Wi-Fi nem rede física medidos.';
    if (semRede(v)) return 'Sem rede na visita: todos os pontos de Wi-Fi mediram 0 Mbps. A nota reflete a falta de conexão, não a qualidade do Wi-Fi. Refazer a medição quando a conexão voltar.';
    if (l.tipo === 'fis') return 'Só a rede física foi medida. Sem o Wi-Fi medido, a nota vale só a rede cabeada.';
    var qw = R.qualidadeWifi(l.dl, l.ping, jitterMedio(v));
    if (l.tipo === 'hib') {
      var qf = qualRede(v), t = 'Na média das duas redes, a escola ' + fx + '.';
      if (qf.k === 'b' && qw.k !== 'b') t += ' A rede física está boa' + (l.faixa === 'ap' ? ' e compensa um Wi-Fi ' + (qw.k === 'r' ? 'regular' : 'ruim') : ' mas não compensa um Wi-Fi ' + (qw.k === 'r' ? 'regular' : 'ruim')) + '.';
      else if (qw.k === 'b' && (qf.k === 'r' || qf.k === 'f')) t += ' O Wi-Fi está bom, mas a rede física está ' + (qf.k === 'r' ? 'regular' : 'ruim') + '.';
      return t;
    }
    if (pts.length >= 2) {
      var o = pts.slice().sort(function (a, b) { return a.download - b.download; }), lo = o[0], hi = o[o.length - 1];
      if (hi.download - lo.download >= 0.5 * hi.download) {
        return 'A cobertura é desigual. Em ' + hi.nome + ' a medição é de ' + dec1(hi.download) + ' Mbps e ' + dec1(hi.ping) + ' ms, e em ' + lo.nome + ' é de ' + dec1(lo.download) + ' Mbps e ' + dec1(lo.ping) + ' ms. ' +
          (hi.download > R.LIM.wifi.dlRuim ? 'Isso indica que o link entrega e o Wi-Fi não chega em todos os ambientes.' : 'Isso indica que o link é o gargalo.');
      }
    }
    if (qw.k === 'n') return 'O Wi-Fi não tem medição de velocidade e latência registrada.';
    if (qw.k === 'b') return 'O Wi-Fi atende o VDI: ' + dec1(l.dl) + ' Mbps e ' + Math.round(l.ping) + ' ms em média.';
    return 'O Wi-Fi está ' + (qw.k === 'r' ? 'regular' : 'ruim') + ' em todos os ambientes: ' + dec1(l.dl) + ' Mbps e ' + Math.round(l.ping) + ' ms em média.';
  }

  var ORD_MAIOR = ['Maior', 'Segunda maior', 'Terceira maior', 'Quarta maior', 'Quinta maior', 'Sexta maior', 'Sétima maior', 'Oitava maior', 'Nona maior', 'Décima maior'];
  var ORD_MELHOR = ['Melhor', 'Segunda melhor', 'Terceira melhor', 'Quarta melhor', 'Quinta melhor', 'Sexta melhor', 'Sétima melhor', 'Oitava melhor', 'Nona melhor', 'Décima melhor'];
  function posicao(L, l) {
    var m = medidas(L); if (!l.medida) return '';
    var fim = ', em um ranking de ' + m.length + (m.length === 1 ? ' escola.' : ' escolas.');
    if (l.nota < R.LIM.nota.aprovada) {
      var pr = prioridade(L, m.length + 1), idx = -1;
      pr.forEach(function (x, i) { if (x.l.chave === l.chave) idx = i; });

    return (idx2 < 10 ? ORD_MELHOR[idx2] : (idx2 + 1) + 'ª melhor') + ' nota do projeto' + fim;
  }

  // Causas desta escola, agrupadas por quem resolve: equipamento é compra, instalação é obra, pessoas é conversa
  function causasPorTipo(v) {
    var i = v.infra || {}, c = v.conclusao || {}, w = v.wifi || {}, out = [];
    var add = function (grupo, item, valor) { out.push({ grupo: grupo, item: item, valor: valor }); };
    var esp = R.qualidadeEspectro(i.espectroWifi); if (esp.k === 'f' || esp.k === 'r') add('EQUIPAMENTO', 'Espectro do Wi-Fi', i.espectroWifi);
    var sw = R.qualidadeSwitch(i.switch); if (sw.k === 'f' || sw.k === 'r') add('EQUIPAMENTO', 'Switch', i.switch);
    else if (fastEmAlgum(v)) add('EQUIPAMENTO', 'Switch da rede cabeada', 'Fast 10/100');
    var gw = R.qualidadeGateway(i.gateway); if (gw.k === 'f' || gw.k === 'r') add('EQUIPAMENTO', 'Gateway', i.gateway);
    var dn = R.qualidadeDensidade(i.densidadeAps); if (dn.k === 'f' || dn.k === 'r') add('INSTALAÇÃO', 'Posição dos APs', i.densidadeAps);
    var cb = R.qualidadeCabos(i.cabeamento); if (cb.k === 'f') add('INSTALAÇÃO', 'Cabeamento', i.cabeamento);
    if (i.possuiZonaSombra === true) add('INSTALAÇÃO', 'Zona de sombra', i.salasSemSinal || 'Sim');
    if (c.possuiImpeditivo === true) add('PESSOAS', 'Impeditivo registrado', c.observacoesImpeditivo || 'Sim');
    var np = numProf(i.notaProfessor); if (np !== null && np <= 5) add('PERCEPÇÃO', 'Nota dos professores', txt(i.notaProfessor));
    if (ok(w.mediaPing) && w.mediaPing > R.LIM.wifi.pingRegular) add('DESEMPENHO', 'Latência média', dec1(w.mediaPing) + ' ms');

  }


  // ── evolução das escolas aptas e maior ofensor (só leitura) ──────────────────
  // Estado de cada escola em cada data de medição: vale a última medição até aquele dia.
  function serieAptas(linhas) {
    var ev = [];
    linhas.forEach(function (l, i) {
      l.e.serie.forEach(function (v) { if (ok(v.data) && v.calculado && ok(v.calculado.nota)) ev.push({ t: v.data, i: i, f: v.calculado.faixa }); });
    });
    if (!ev.length) return [];
    ev.sort(function (a, b) { return a.t - b.t; });
    // a série começa ao fim da primeira rodada: antes disso as escolas ainda estavam sendo medidas pela primeira vez
    var rs = rodadas(linhas), corte = rs.length ? rs[0].fim : 0;
    var dias = [];
    ev.forEach(function (x) { var d = new Date(Math.max(x.t, corte)); d.setHours(23, 59, 59, 999); var k = d.getTime(); if (dias.indexOf(k) < 0) dias.push(k); });
    dias.sort(function (a, b) { return a - b; });
    var estado = {}, k = 0, pts = [], ult = null;
    dias.forEach(function (lim) {
      while (k < ev.length && ev[k].t <= lim) { estado[ev[k].i] = ev[k].f; k++; }
      var n = 0; for (var q in estado) if (estado[q] === 'ap') n++;
      var ponto = { t: lim, n: n, medidas: Object.keys(estado).length };
      if (!ult || ult.n !== n) pts.push(ponto); else pts[pts.length - 1].fim = lim;
      ult = ponto;
    });
    if (pts[pts.length - 1].t !== dias[dias.length - 1] && !pts[pts.length - 1].fim) pts[pts.length - 1].fim = dias[dias.length - 1];
    return pts;
  }

  // Link escrito com Gb/Giga vale n x 1000 Mbps, mesmo que o app tenha gravado o número puro.
  function mbpsLink(l) {
    var t = txt(l && l.tamanho).toLowerCase().replace(',', '.');
    var m = t.match(/(\d+(?:\.\d+)?)\s*(?:gb|giga|g\b)/);
    return m ? parseFloat(m[1]) * 1000 : (l ? l.mbps : null);
  }
  function vazioCampo(s) { var t = txt(s).trim().toLowerCase(); return t === '' || t === 'selecione'; }

  var OFENSORES = [
    { id: 'link', nome: 'Link de internet abaixo de 1 Gbps', campo: 'link registrado', acao: 'Upgrade do link para 1 Gbps.',
      tem: function (v) { return (v.links || []).some(function (l) { return ok(mbpsLink(l)); }); }, tag: 'LINK' },

  // ── quadrante Histórico do projeto (Visão executiva) ─────────────────────────
  function graficoAptas(pts, atual) {
    var W = 410, H = 190, x0 = 15, x1 = 390, yb = 160, yt = 30;
    var t0 = pts[0].t, t1 = pts[pts.length - 1].fim || pts[pts.length - 1].t, span = Math.max(t1 - t0, 1);
    var nmax = Math.max.apply(null, pts.map(function (p) { return p.n; }).concat([atual, 4]));
    var X = function (t) { return x0 + (t - t0) / span * (x1 - x0); }, Y = function (n) { return yb - n / nmax * (yb - yt); };
    var lista = [];
    pts.forEach(function (p, i) { lista.push({ x: X(p.t), n: p.n }); if (p.fim && i < pts.length - 1) lista.push({ x: X(p.fim), n: p.n }); });
    var ultimo = pts[pts.length - 1]; if (ultimo.fim) lista.push({ x: X(ultimo.fim), n: ultimo.n });
    var dLinha = lista.map(function (q, i) { return (i ? 'L' : 'M') + q.x.toFixed(1) + ',' + Y(q.n).toFixed(1); }).join(' ');
    var ult = lista[lista.length - 1];
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Escolas aptas ao longo do tempo, de ' + pts[0].n + ' para ' + atual + '">' +
      '<defs><linearGradient id="gvAp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FAE6A" stop-opacity=".55"/><stop offset="1" stop-color="#2FAE6A" stop-opacity=".05"/></linearGradient></defs>' +
      '<g stroke="#E6E2EF"><line x1="0" y1="' + yb + '" x2="' + W + '" y2="' + yb + '"/><line x1="0" y1="' + Y(nmax / 2).toFixed(1) + '" x2="' + W + '" y2="' + Y(nmax / 2).toFixed(1) + '" stroke-dasharray="3 4"/></g>' +
      '<path d="' + dLinha + ' L' + ult.x.toFixed(1) + ',' + yb + ' L' + lista[0].x.toFixed(1) + ',' + yb + ' Z" fill="url(#gvAp)"/>' +
      '<path d="' + dLinha + '" fill="none" stroke="#1E8E55" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var lx0 = X(pts[pts.length - 1].t), ultLab = -99;
    pts.forEach(function (p, i) {
      var cx = X(p.t).toFixed(1), cy = Y(p.n).toFixed(1);
      if (i === pts.length - 1) return;
      var rotulo = (lx0 - X(p.t) > 30) && (X(p.t) - ultLab > 22);
      if (rotulo) ultLab = X(p.t);
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#fff" stroke="#1E8E55" stroke-width="3"/>' +
        (i === 0 ? '<text x="' + cx + '" y="' + (Y(p.n) - 12).toFixed(1) + '" text-anchor="middle" font-size="' + (i === 0 ? 15 : 12) + '" font-weight="800" fill="#14693C">' + p.n + '</text>' : '');
    });
    var lx = X(pts[pts.length - 1].t);
    svg += '<circle cx="' + lx.toFixed(1) + '" cy="' + Y(ultimo.n).toFixed(1) + '" r="15" fill="#1E8E55"/><text x="' + lx.toFixed(1) + '" y="' + (Y(ultimo.n) + 6).toFixed(1) + '" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">' + ultimo.n + '</text>';
    // meses no eixo
    var d = new Date(t0); d.setDate(1); d.setHours(0, 0, 0, 0);
    var meses = [];
    for (var g = 0; g < 14 && d.getTime() <= t1; g++) { if (d.getTime() >= t0 - 15 * 864e5) meses.push({ t: Math.max(d.getTime(), t0), m: d.getMonth() }); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    var salto = meses.length > 7 ? 2 : 1;
    svg += '<g font-size="10.5" fill="#6A6480">' + meses.filter(function (m, i) { return i % salto === 0; }).map(function (m) {
      var x = Math.min(Math.max(X(m.t), 8), W - 22);
      return '<text x="' + x.toFixed(1) + '" y="178">' + MESES[m.m].charAt(0).toUpperCase() + MESES[m.m].slice(1) + '</text>';
    }).join('') + '</g></svg>';
    return svg;
  }

<script>
/* Pasta conectada: o painel lembra a pasta "aplicativos" do OneDrive e lê os arquivos novos dela.
 * Usa a API de pastas do Chrome/Edge (File System Access). O navegador guarda só uma referência à pasta;
 * nada é enviado para a internet e o painel nunca escreve na pasta (somente leitura).
 */
(function (root) {
  'use strict';
  var DB = 'painel-vistorias', ST = 'pasta', EXT = /\.(zip|csv|json)$/i, PROFUNDIDADE = 8;

  function abrirDb() {
    return new Promise(function (res, rej) {
      var r = root.indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(modo, fn) {
    return abrirDb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(ST, modo), req = fn(t.objectStore(ST));
        t.oncomplete = function () { db.close(); res(req && req.result); };
        t.onerror = function () { db.close(); rej(t.error); };
      });
    });
  }
  function suportado() { return typeof root.showDirectoryPicker === 'function' && !!root.indexedDB; }
  function guardar(h) { return tx('readwrite', function (s) { return s.put(h, 'handle'); }); }
  function recuperar() { return tx('readonly', function (s) { return s.get('handle'); }).catch(function () { return null; }); }
  function esquecer() { return tx('readwrite', function (s) { return s.delete('handle'); }).catch(function () {}); }

  async function escolher() {
    var h = await root.showDirectoryPicker({ id: 'painel-aplicativos', mode: 'read' });
    try { await guardar(h); } catch (e) { /* sem memória: funciona só nesta sessão */ }
    return h;
  }

  async function permissao(h, pedir) {
    var o = { mode: 'read' };
    if (h.queryPermission && (await h.queryPermission(o)) === 'granted') return true;
    if (!pedir || !h.requestPermission) return false;
    return (await h.requestPermission(o)) === 'granted';
  }

  // Percorre a pasta e subpastas. Devolve { total, novos: [{file, chave}] }; já lidos (mesmo caminho, tamanho e data) são pulados.
  async function listar(h, jaLidos) {
    var total = 0, novos = [];
    async function andar(dir, caminho, nivel) {
      for await (var par of dir.entries()) {
        var nome = par[0], item = par[1];
        if (nome.charAt(0) === '.' || nome.indexOf('~$') === 0) continue;
        if (item.kind === 'directory') { if (nivel < PROFUNDIDADE) await andar(item, caminho + nome + '/', nivel + 1); continue; }
        if (!EXT.test(nome)) continue;
        total++;
        var f = await item.getFile();
        if (!f.size) continue;                       // arquivo ainda sincronizando
        var chave = caminho + nome + '|' + f.size + '|' + f.lastModified;
        if (jaLidos && jaLidos[chave]) continue;
        novos.push({ file: f, chave: chave });
      }
    }
    await andar(h, '', 0);
    return { total: total, novos: novos };
  }

  root.PainelPasta = { suportado: suportado, escolher: escolher, recuperar: recuperar, esquecer: esquecer, permissao: permissao, listar: listar, guardar: guardar };
})(typeof self !== 'undefined' ? self : this);

  // ── leitura de arquivos ──────────────────────────────────────────────────────
  async function carregarArquivos(files, opcoes) {
    opcoes = opcoes || {};
    var L = { novas: 0, duplicadas: 0, atualizadas: 0, substituidas: 0, parciais: 0, pacotes: 0, planilhas: 0, jsons: 0, repetidos: 0, ignorados: 0, nomesIgnorados: [], avisos: [] };
    S.ocupado = 'Lendo arquivos...'; S.aviso = ''; render();
    for (var i = 0; i < files.length; i++) {
      var f = files[i], nome = f.name || '', ext = nome.split('.').pop().toLowerCase();
      try {
        var r = null, lista = null, pid = null;
        if (ext === 'zip') {
          var z = await N.lerZip(f, window.JSZip, nome);
          lista = z.vistorias; pid = z.pacoteId; L.pacotes++; z.avisos.forEach(function (a) { L.avisos.push(a); });
          if (!lista.length) { L.ignorados++; f.__ign = true; L.nomesIgnorados.push(nome); continue; }
        } else if (ext === 'csv') {
          var t = await f.text();
          lista = N.lerCsvAntigo(t, nome);
          if (!lista.length) {
            L.ignorados++; f.__ign = true; L.nomesIgnorados.push(nome);
            if (/^﻿?uuid;escola;projeto/.test(t)) L.avisos.push(nome + ': este é o CSV longo do pacote (para Excel ou Power BI). Carregue o .zip, que traz tudo.');
            continue;
          }
          L.planilhas++;
        } else if (ext === 'json') {
          var j = JSON.parse(await f.text());
          if (!j.identificacao || !j.local) { L.ignorados++; f.__ign = true; L.nomesIgnorados.push(nome); continue; }
          lista = [N.normalizarJson(j, null, nome)]; L.jsons++;
        } else { L.ignorados++; f.__ign = true; L.nomesIgnorados.push(nome); continue; }
        r = banco.adicionar(lista, pid);
        L.novas += r.novas; L.duplicadas += r.duplicadas; L.atualizadas += r.atualizadas; L.substituidas += r.substituidasLegado;
        if (r.pacoteRepetido) L.repetidos++;
        if (r.novas) L.parciais += lista.filter(function (v) { return v.campos !== 'completa'; }).length;
      } catch (e) { L.ignorados++; f.__ign = true; L.nomesIgnorados.push(nome); L.avisos.push(nome + ': ' + e.message); }
    }
    S.ocupado = ''; S.carregar = false;
    if (!opcoes.silencioso || L.novas || L.atualizadas || L.substituidas) S.leitura = L;
    if (L.novas && S.view === 'geral' && !contexto().projetos.length) S.view = 'geral';
    render();
  }

  // pastas arrastadas: percorre os arquivos de dentro
  function lerEntrada(entry, saida) {
    return new Promise(function (resolve) {
      if (entry.isFile) { entry.file(function (f) { saida.push(f); resolve(); }, function () { resolve(); }); }

        var leitor = entry.createReader(), todos = [];
        (function lote() {
          leitor.readEntries(async function (ents) {
            if (!ents.length) { for (var i = 0; i < todos.length; i++) await lerEntrada(todos[i], saida); resolve(); }
            else { todos = todos.concat(Array.prototype.slice.call(ents)); lote(); }
          }, function () { resolve(); });
        })();
      } else resolve();
    });
  }
  async function arquivosDoDrop(dt) {
    var out = [];
    if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
      var ents = [];
      for (var i = 0; i < dt.items.length; i++) { var en = dt.items[i].webkitGetAsEntry(); if (en) ents.push(en); }
      for (var k = 0; k < ents.length; k++) await lerEntrada(ents[k], out);
    } else out = Array.prototype.slice.call(dt.files || []);
    return out;
  }

  // ── imagem da topologia ──────────────────────────────────────────────────────

        '<text x="' + (x + 10) + '" y="' + (y + 16) + '" font-size="9" font-weight="bold" fill="#6B6479">' + esc(no.tipo) + '</text>' +
        '<text x="' + (x + 10) + '" y="' + (y + 34) + '" font-size="13" font-weight="bold" fill="#1F1A2B">' + esc(corte(no.titulo, 26)) + '</text>' +
        '<text x="' + (x + 10) + '" y="' + (y + 50) + '" font-size="10.5" fill="#4A4458">' + esc(corte(no.det, 34)) + '</text>' +
        '<text x="' + (x + 10) + '" y="' + (y + 68) + '" font-size="10.5" font-weight="bold" fill="' + c[2] + '">' + esc(corte(no.ql, 34)) + '</text>';

    }
    var altura = yMax + P;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + largura + '" height="' + altura + '" viewBox="0 0 ' + largura + ' ' + altura + '" font-family="Arial, sans-serif">' +
      '<rect width="100%" height="100%" fill="#FFFFFF"/><text x="' + P + '" y="20" font-size="14" font-weight="bold" fill="#3F1D63">Topologia de rede: ' + esc(v.escola) + ' (' + V.dt(v.data) + ')</text>' + out + '</svg>';
  }

  function baixarTopologia(v) {
    var svg = svgTopologia(v), nome = 'Topologia_' + nomeArq(v.escola) + '_' + nomeArq(V.dt(v.data));
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = img.width * 2; c.height = img.height * 2;
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { if (b) salvar(b, nome + '.png'); else salvar(new Blob([svg], { type: 'image/svg+xml' }), nome + '.svg'); }, 'image/png');
    };
    img.onerror = function () { salvar(new Blob([svg], { type: 'image/svg+xml' }), nome + '.svg'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    S.aviso = 'Imagem do esquema gerada: ' + nome; render();
  }

  // ── ações ────────────────────────────────────────────────────────────────────
  var ACOES = {
    toggleCarregar: function () { S.carregar = !S.carregar; S.exportar = false; S.exportEscopo = null; },
    toggleExportar: function () { S.exportar = !S.exportar; S.carregar = false; S.exportEscopo = null; },
    fecharAviso: function () { S.aviso = ''; },
    toggleMenuDados: function () { S.menuDados = !S.menuDados; },
    conectarPasta: function () { conectarPasta(); return 'semRender'; },
    atualizarPasta: function () { escanearPasta(false); return 'semRender'; },
    fecharLeitura: function () { S.leitura = null; },
    inc: function (a) { S.inc[a] = !S.inc[a]; },
    escolherArquivos: function () { var el = document.getElementById('arq'); if (el) el.click(); return 'semRender'; },
    escolherPasta: function () { var el = document.getElementById('pasta'); if (el) el.click(); return 'semRender'; },
    gerarHtml: function () { gerarHtml(); return 'semRender'; },
    verGeral: function () { S.view = 'geral'; S.aberto = null; },
    abrirProjeto: function (a) { S.view = 'projeto'; S.projeto = a; S.filtro = 'todos'; S.qual = 'todas'; S.busca = ''; S.aberto = null; S.aba = 'resumo'; },
    filtro: function (a) { S.filtro = a; },
    qual: function (a) { S.qual = a; },
    abrir: function (a) { S.aberto = S.aberto === a ? null : a; S.aba = 'resumo'; S.no = null; S.foto = null; S.pdf = false; S.pin = null; },
    aba: function (a) { S.aba = a; S.no = null; S.foto = null; S.pdf = false; },
    pin: function (a) { S.pin = S.pin === a ? null : a; },
    no: function (a) { S.no = S.no === a ? null : a; },
    foto: function (a) { S.foto = a; },
    fecharFoto: function () { S.foto = null; },
    fotoNav: function (a) {
      var e = contexto().escolas.filter(function (x) { return x.chave === S.aberto; })[0]; if (!e) return;
      var v = contexto().vistoriaSelecionada(e);
      var lista = S.aba === 'espectro' ? V.listaEspectro(v) : V.listaFotos(v), i = -1;
      lista.forEach(function (f, n) { if (f.rel === S.foto) i = n; });
      if (i >= 0 && lista.length) S.foto = lista[(i + (+a) + lista.length) % lista.length].rel;
    },
    abrirPdf: function () { S.pdf = !S.pdf; },
    avisar: function (a) { S.aviso = a; },
    verEscola: function (a) { S.filtro = 'todos'; S.qual = 'todas'; S.busca = ''; S.aberto = a; S.aba = 'resumo'; S.no = null; S.foto = null; S.pdf = false; S.pin = null; S.rolar = true; },
    abrirEscola: function (a) { var e = contexto().escolas.filter(function (x) { return x.chave === a; })[0]; if (!e) return; ACOES.abrirProjeto(V.nomeProjeto(e.ultima)); S.aberto = a; },
    criticoGeral: function (a) { var C = contexto(), c = V.criticos(C.escolas).filter(function (x) { return x.tit === a; })[0]; if (c) ACOES.abrirEscola(c.alvo[0].chave); },
    criticoProjeto: function (a) { var C = contexto(), base = C.escolas.filter(function (e) { return V.nomeProjeto(e.ultima) === S.projeto; }), c = V.criticos(base).filter(function (x) { return x.tit === a; })[0]; if (c) { S.aberto = c.alvo[0].chave; S.aba = 'resumo'; } },
    verMedicao: function (a) { var p = a.split('||'); S.sel[p[0]] = p[1]; S.aba = 'resumo'; S.no = null; S.foto = null; S.pdf = false; S.pin = null; },
    voltarUltima: function (a) { delete S.sel[a]; S.aba = 'hist'; },
    baixarTopo: function (a) { var v = vistoriaPorChave(a); if (v) baixarTopologia(v); return 'semRender'; },
    baixarJson: function (a) { var v = vistoriaPorChave(a); if (v) salvar(new Blob([JSON.stringify(limpo(v), null, 2)], { type: 'application/json' }), 'vistoria_' + nomeArq(v.escola) + '_' + nomeArq(V.dt(v.data)) + '.json'); return 'semRender'; },
    baixarPdf: function (a) { var v = vistoriaPorChave(a); if (v && v.arquivos.pdf) blobDe(v, v.arquivos.pdf).then(function (b) { if (b) salvar(b, 'Vistoria_' + nomeArq(v.escola) + '_' + nomeArq(V.dt(v.data)) + '.pdf'); }); return 'semRender'; },
    baixarPacote: function (a) {
      var v = vistoriaPorChave(a); if (!v || !v.zipRef) return 'semRender';
      var z = new window.JSZip(), base = v.arquivos.base || '', pend = [];
      v.zipRef.forEach(function (caminho, f) { if (!f.dir && caminho.indexOf(base) === 0) pend.push(f.async('arraybuffer').then(function (buf) { z.file(caminho.slice(base.length), buf); })); });
      Promise.all(pend).then(function () { return z.generateAsync({ type: 'blob' }); }).then(function (b) { salvar(b, 'Vistoria_' + nomeArq(v.escola) + '_' + nomeArq(V.dt(v.data)) + '.zip'); });
      return 'semRender';
    }
  };

  // ── ações da visão gestão (só mexem em estado de tela, nunca em dado) ─────────
  var abrirProjetoBase = ACOES.abrirProjeto, verGeralBase = ACOES.verGeral;
  ACOES.abrirProjeto = function (a) { abrirProjetoBase(a); resetGestao(); S.rolarTopo = true; };
  ACOES.verGeral = function (a) { verGeralBase(a); S.gVer = {}; S.rolarTopo = true; };
  ACOES.gAba = function (a) { S.gAba = a; S.gVer = {}; S.rolarTopo = true; };
  ACOES.gTipo = function (a) { S.gTipo = S.gTipo === a ? 'todas' : a; S.gVer.escolas = false; };
  ACOES.gOrdem = function (a) { S.gOrdem = a; };
  ACOES.gMelhoria = function (a) { S.gMelhoria = S.gMelhoria === a ? 'todas' : a; S.gVer.melhorias = false; };
  ACOES.gFiltro = function (a) { S.gFiltro = S.gFiltro === a ? 'todas' : a; S.gVer.escolas = false; };
  // Exportar só o projeto aberto ou só a escola aberta (o do menu Dados continua exportando tudo)
  ACOES.exportarEscopo = function (a) {
    var C = contexto();
    if (a === 'escola') {
      var e = C.escolas.filter(function (x) { return x.chave === S.ficha; })[0]; if (!e) return;
      S.exportEscopo = { tipo: 'escola', chave: e.chave, nome: window.PainelGestao.nomeEscola(e.ultima.escola), projeto: V.nomeProjeto(e.ultima) };
    } else {
      if (!S.projeto) return;
      S.exportEscopo = { tipo: 'projeto', nome: S.projeto };
    }
    S.exportar = true; S.carregar = false; S.menuDados = false; S.rolarTopo = true;
  };
  ACOES.gVer = function (a) { S.gVer[a] = !S.gVer[a]; };
  ACOES.abrirFicha = function (a) {
    var e = contexto().escolas.filter(function (x) { return x.chave === a; })[0]; if (!e) return;
    S.view = 'ficha'; S.ficha = a; S.projeto = V.nomeProjeto(e.ultima); S.fichaOrigem = S.gAba === 'escolas' ? 'Escolas' : S.gAba === 'melhorias' ? 'Melhorias' : 'Prioridade de intervenção';
    S.aberto = null; S.aba = 'resumo'; S.no = null; S.foto = null; S.pdf = false; S.pin = null; S.rolarTopo = true;
  };
  ACOES.voltarProjeto = function (a) { S.rolarFicha = S.ficha; if (a) S.gAba = a; S.view = 'projeto'; S.aberto = null; S.no = null; S.foto = null; S.pdf = false; S.rolarTopo = true; };

  // Copiar o texto da tela (resumo para diretoria, texto do projeto ou resumo da escola). Só lê, não grava nada.
  function copiarTexto(t) {
    var fim = function (okc) { S.aviso = okc ? 'Texto copiado. É só colar na apresentação ou na mensagem.' : 'Não consegui copiar sozinho. Selecione o texto na tela e copie com Ctrl+C.'; render(); };
    var alt = function () {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); var r = false; try { r = document.execCommand('copy'); } catch (e) { r = false; } ta.remove(); fim(r);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { fim(true); }, alt); else alt();
  }
  ACOES.copiarTexto = function () { var t = VG.textoCopiavel(contexto()); if (t) copiarTexto(t); return 'semRender'; };
  // Abre o PDF da vistoria em outra aba (arquivo vem do .zip ou do HTML embutido)
  ACOES.verPdf = function (a) {
    var v = vistoriaPorChave(a); if (!v || !v.arquivos || !v.arquivos.pdf) return 'semRender';
    blobDe(v, v.arquivos.pdf).then(function (b) {
      if (!b) { S.aviso = 'Não encontrei o PDF desta vistoria.'; render(); return; }
      var url = URL.createObjectURL(b), w = window.open(url, '_blank');
      if (!w) salvar(b, 'Vistoria_' + nomeArq(v.escola) + '_' + nomeArq(V.dt(v.data)) + '.pdf');
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    });
    return 'semRender';
  };
  window.addEventListener('hashchange', function () { render(); });

  document.addEventListener('click', function (ev) {
    var alvo = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (S.menuDados && !(ev.target.closest && ev.target.closest('.menu-dados'))) { S.menuDados = false; if (!alvo) { render(); return; } }
    if (!alvo || alvo.disabled) return;
    var fn = ACOES[alvo.getAttribute('data-act')];
    if (!fn) return;
    var doMenu = alvo.classList.contains('md-item');
    if (doMenu) S.menuDados = false;
    var rr = fn(alvo.getAttribute('data-arg'));
    if (rr !== 'semRender' || doMenu) render();
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.foto) { S.foto = null; render(); }
    else if (ev.key === 'Escape' && S.menuDados) { S.menuDados = false; render(); }
    else if (S.foto && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { ACOES.fotoNav(ev.key === 'ArrowRight' ? '1' : '-1'); render(); } });
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'busca') { S.busca = ev.target.value; render(); }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && (ev.target.id === 'arq' || ev.target.id === 'pasta')) {
      var fs = Array.prototype.slice.call(ev.target.files || []);
      ev.target.value = '';
      if (fs.length) carregarArquivos(fs);
    }
  });
  ['dragenter', 'dragover'].forEach(function (n) {
    document.addEventListener(n, function (ev) { ev.preventDefault(); document.body.classList.add('dragging'); });
  });
  document.addEventListener('dragleave', function (ev) { if (!ev.relatedTarget) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', async function (ev) {
    ev.preventDefault(); document.body.classList.remove('dragging');
    var fs = await arquivosDoDrop(ev.dataTransfer);
    if (fs.length) carregarArquivos(fs);
  });

  // ── pasta conectada (OneDrive "aplicativos") ─────────────────────────────────
  async function conectarPasta() {
    try {
      var h = await PP.escolher();
      if (S.pasta) banco.limpar();                 // trocar de pasta recomeça do zero
      S.pasta = { handle: h, nome: h.name, lidoEm: 0, total: 0, permitido: true };
      S.lidos = {}; S.leitura = null;
      await escanearPasta(false);
    } catch (e) { if (e && e.name !== 'AbortError') { S.aviso = 'Não consegui abrir a pasta: ' + e.message; render(); } }
  }

  async function escanearPasta(silencioso) {
    var P = S.pasta; if (!P || S.lendoPasta) return;
    S.lendoPasta = true;
    try {
      var ok = await PP.permissao(P.handle, !silencioso);
      if (!ok) { P.permitido = false; return; }
      P.permitido = true;
      S.ocupado = 'Procurando arquivos novos na pasta...'; render();
      var ach = await PP.listar(P.handle, S.lidos);
      P.total = ach.total;
      if (ach.novos.length) {
        await carregarArquivos(ach.novos.map(function (x) { return x.file; }), { silencioso: silencioso });
        ach.novos.forEach(function (x) { if (!x.file.__ign) S.lidos[x.chave] = 1; });
      } else S.ocupado = '';
      P.lidoEm = Date.now();
      if (!silencioso && !ach.novos.length) S.aviso = 'Pasta lida: nenhum arquivo novo desde a última leitura.';
    } catch (e) {
      S.ocupado = '';
      S.aviso = 'Não consegui ler a pasta (' + (e && e.message ? e.message : e) + '). Clique em "Trocar pasta" e escolha de novo.';
    } finally { S.lendoPasta = false; render(); }
  }

  async function iniciarPasta() {
    if (!PP || !PP.suportado()) return;
    var h = await PP.recuperar();
    if (!h) return;
    S.pasta = { handle: h, nome: h.name, lidoEm: 0, total: 0, permitido: null };
    render();
    if (await PP.permissao(h, false)) await escanearPasta(true);
    else { S.pasta.permitido = false; render(); }
    // relê sozinho quando você volta para a aba e a cada 3 minutos com a aba aberta
    document.addEventListener('visibilitychange', function () { if (!document.hidden && S.pasta && S.pasta.permitido) escanearPasta(true); });
    setInterval(function () { if (!document.hidden && S.pasta && S.pasta.permitido) escanearPasta(true); }, 180000);
  }

  // gancho para testes e depuração
  window.__painel = { banco: banco, S: S, render: render, carregarArquivos: carregarArquivos, escanearPasta: escanearPasta, iniciarPasta: iniciarPasta };

  carregarEmbutido();
  render();
  iniciarPasta();
})();

</script>
